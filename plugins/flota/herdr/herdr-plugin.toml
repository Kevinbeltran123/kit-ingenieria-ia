id = "kit.flota.puente"
name = "Flota: puente a cmux"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Registra cada cambio de estado de los agentes y lo refleja en cmux (estado en la barra, avisos y log)"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-I", "puente.py"]

[[events]]
on = "pane.closed"
command = ["python3", "-I", "puente.py"]
