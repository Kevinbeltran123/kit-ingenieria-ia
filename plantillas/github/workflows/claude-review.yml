# Revisión de PR con Claude. Requiere el secreto ANTHROPIC_API_KEY.
# Seguro por diseño: sin pull_request_target, permisos mínimos, solo herramientas de lectura,
# acción fijada por SHA. No corre en PRs de forks (no tienen acceso al secreto).
# Comenta con el GITHUB_TOKEN del workflow (github_token). Sin él, la acción cambia un token OIDC por
# uno de la Claude GitHub App en api.anthropic.com y falla si la App no está instalada en la
# organización. Para usar la App: quitar github_token y agregar id-token: write a los permisos del job.
name: Revisión con Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

# Una revisión por PR a la vez: un push nuevo cancela la que siga corriendo sobre el commit anterior.
concurrency:
  group: revision-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Marketplace propio con pr-review-toolkit fijado en el commit que auditó el kit (la misma entrada
      # de su marketplace.json). Con la URL del marketplace oficial, la acción lo instalaría desde la
      # cabeza de main, con permiso para comentar en el PR y la API key en el entorno. Una copia local
      # del oficial no sirve: Claude Code reserva el nombre claude-plugins-official a GitHub de anthropics.
      - name: Marketplace con el plugin de revisión fijado por SHA
        run: |
          mkdir -p "$RUNNER_TEMP/marketplace-revision/.claude-plugin"
          cat > "$RUNNER_TEMP/marketplace-revision/.claude-plugin/marketplace.json" <<'JSON'
          {
            "name": "revision-pr",
            "owner": {"name": "kit-ingenieria-ia"},
            "plugins": [
              {
                "name": "pr-review-toolkit",
                "source": {
                  "source": "git-subdir",
                  "url": "https://github.com/anthropics/claude-plugins-official.git",
                  "path": "plugins/pr-review-toolkit",
                  "ref": "main",
                  "sha": "0412be76f50ab4f4f8abff3753efa9269fbbca5b"
                }
              }
            ]
          }
          JSON
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/marketplace-revision
          plugins: "pr-review-toolkit@revision-pr"
          prompt: |
            Revisa este PR (${{ github.repository }}#${{ github.event.pull_request.number }}).
            Reporta solo problemas con evidencia: bugs, seguridad, pruebas que no prueban nada,
            errores silenciados y violaciones de la arquitectura descrita en CLAUDE.md.
            No comentes estilo (de eso se encarga ruff). Si no hay problemas, dilo en una línea.
          claude_args: |
            --max-turns 15
            --allowedTools Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment
