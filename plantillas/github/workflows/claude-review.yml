# Revisión de PR con Claude. Requiere el secreto ANTHROPIC_API_KEY.
# Seguro por diseño: sin pull_request_target, permisos mínimos, solo herramientas de lectura,
# acción fijada por SHA. No corre en PRs de forks (no tienen acceso al secreto).
name: Revisión con Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  revisar:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "pr-review-toolkit@claude-plugins-official"
          prompt: |
            Revisa este PR (${{ github.repository }}#${{ github.event.pull_request.number }}).
            Reporta solo problemas con evidencia: bugs, seguridad, pruebas que no prueban nada,
            errores silenciados y violaciones de la arquitectura descrita en CLAUDE.md.
            No comentes estilo (de eso se encarga ruff). Si no hay problemas, dilo en una línea.
          claude_args: |
            --max-turns 15
            --allowedTools Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment
