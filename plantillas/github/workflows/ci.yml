# Acciones fijadas por SHA (verificadas el 2026-11-07). Actualízalas con Dependabot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.6"  # sin esto instala la última, aunque tenga horas; igual al rev de uv-pre-commit
      - name: Instalar
        run: uv sync --locked
      - name: Hooks de pre-commit sin paso propio (complexipy, uv-lock y los que se agreguen)
        # `git commit --no-verify` salta los hooks locales; aquí se vuelven a correr. Se saltan los que
        # ya tienen paso en este job, y gitleaks, que tiene su propio job: su hook solo mira lo que está
        # en stage y en CI no hay nada en stage.
        run: >-
          uvx prek@0.5.9 run --all-files --show-diff-on-failure
          --skip ruff-check --skip ruff-format --skip ty --skip import-linter --skip deptry --skip gitleaks
      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tipos
        run: uv run ty check
      - name: Arquitectura
        run: uv run lint-imports
      - name: Pruebas
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Dependencias sin usar
        run: uv run deptry .
      - name: Vulnerabilidades en dependencias
        run: uv run pip-audit
      - name: Código muerto (reporte, no bloquea)
        run: uv run vulture || true

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # toda la historia: un secreto borrado en un commit posterior sigue filtrado
      - name: Secretos en la historia (gitleaks 8.30.1, la misma versión del hook de pre-commit)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Seguridad de GitHub Actions
        run: uvx zizmor==1.31.1 --offline .
