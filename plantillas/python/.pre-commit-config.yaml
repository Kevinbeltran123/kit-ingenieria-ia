# Se ejecuta con prek (`uvx prek@0.5.9 install`) o pre-commit. Revs verificados el 2026-11-07.
# ruff y complexipy corren con `uv run`: usan la versión de uv.lock, la misma de CI, y Dependabot
# las actualiza en un solo lugar. Los argumentos y tipos de archivo son los de sus hooks oficiales.
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      - id: complexipy
        name: complexipy
        entry: uv run complexipy
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|src/.*\.py)$
