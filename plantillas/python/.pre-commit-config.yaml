# Se ejecuta con prek (`uvx prek install`) o pre-commit. Revs verificados el 2026-11-07.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # igual a la de uv.lock; más de 7 días de publicada
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.3.0
    hooks:
      - id: complexipy
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|src/.*\.py)$
